[package]
name = "dmidecode-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust SMBIOS inventory viewer"

[features]
screenshots = ["dep:image"]

[dependencies]
dmidecode-rs = { path = "vendor/dmidecode-rs", default-features = false }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[workspace]
members = ["vendor/dmidecode-rs"]
resolver = "2"
